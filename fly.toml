# fly.toml app configuration file generated for bifur on 2026-08-22T17:07:11+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bifur'
primary_region = 'ams'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
[env]
  LOG_LEVEL = 'debug'

[http_service]
  internal_port = 8080
  force_https = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
